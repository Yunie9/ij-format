name: Build and verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build plugin and run compatibility checks
        run: ./gradlew :idea-plugin:buildPlugin :idea-plugin:compileTestJava :idea-plugin:verifyPlugin
